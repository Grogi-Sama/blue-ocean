<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <title>Reef Trio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <!-- Arka plan: su gradyanı + yükselen kabarcıklar (dekoratif) -->
  <div class="ocean-bg" aria-hidden="true"><div id="bubbles"></div></div>

  <div id="app">

    <!-- ============ ANA MENÜ ============ -->
    <section id="screen-menu" class="screen active">
      <header class="topbar">
        <div class="pill lives-pill" id="menuLives">
          <img class="heart" src="assets/ui/heart.png" alt="" draggable="false"><b class="lives-count">3</b>
          <small class="lives-timer"></small>
        </div>
        <button class="pill coin-pill" data-action="open-shop">
          <img class="coin" src="assets/ui/coin.png" alt="" draggable="false"><b class="coin-count">0</b><span class="plus">+</span>
        </button>
      </header>

      <div class="menu-center">
        <div class="logo">
          <div class="logo-icons"><img src="assets/tiles/clownfish.png" alt=""><img src="assets/tiles/pearl.png" alt=""><img src="assets/tiles/starfish.png" alt=""></div>
          <h1 data-i18n="gameTitle">Mercan Üçlüsü</h1>
          <p class="subtitle" data-i18n="gameSubtitle">Üçünü bul, resifi temizle!</p>
        </div>

        <div class="level-badge"><span data-i18n="level">Seviye</span> <b id="menuLevel">1</b></div>
        <button class="btn btn-play" data-action="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.2-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg><span data-i18n="play">Oyna</span></button>

        <button class="btn btn-soft daily-btn" id="dailyBtn" data-action="open-daily"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9.5 15l1.8 1.8 3.5-3.6"/></svg><span data-i18n="daily">Günlük Ödül</span></button>

        <div class="menu-row">
          <button class="btn btn-soft" data-action="open-tutorial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg><span data-i18n="tutorial">Eğitim</span></button>
          <button class="btn btn-soft" data-action="open-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg><span data-i18n="settings">Ayarlar</span></button>
        </div>
      </div>
    </section>

    <!-- ============ OYUN EKRANI ============ -->
    <section id="screen-game" class="screen">
      <header class="topbar game-topbar">
        <div class="pill lives-pill small"><img class="heart" src="assets/ui/heart.png" alt="" draggable="false"><b class="lives-count">3</b></div>
        <div class="level-title"><span data-i18n="level">Seviye</span> <b id="gameLevel">1</b></div>
        <button class="icon-btn" data-action="pause" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      </header>

      <div id="boardWrap"><div id="board"></div></div>

      <!-- Taşı Kaldır jokeriyle çıkarılan, eşlerini bekleyen kilitli taşlar -->
      <div id="bank" class="bank"></div>

      <div id="tray" class="tray"></div>

      <div class="jokers">
        <button class="joker" data-joker="undo"><span class="j-icon"><img src="assets/jokers/undo.png" alt="" draggable="false"></span><span class="j-name" data-i18n="jUndo">Geri Al</span><b class="j-count"></b></button>
        <button class="joker" data-joker="remove"><span class="j-icon"><img src="assets/jokers/remove.png" alt="" draggable="false"></span><span class="j-name" data-i18n="jRemove">Taşı Kaldır</span><b class="j-count"></b></button>
        <button class="joker" data-joker="shuffle"><span class="j-icon"><img src="assets/jokers/shuffle.png" alt="" draggable="false"></span><span class="j-name" data-i18n="jShuffle">Karıştır</span><b class="j-count"></b></button>
        <button class="joker" data-joker="expand"><span class="j-icon"><img src="assets/jokers/expand.png" alt="" draggable="false"></span><span class="j-name" data-i18n="jExpand">Genişlet</span><b class="j-count"></b></button>
      </div>
    </section>

    <!-- ============ MODALLAR ============ -->
    <div id="modal" class="modal-backdrop" hidden>
      <div class="modal-card" id="modalCard"></div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="js/i18n.js?v=6"></script>
  <script src="js/storage.js?v=6"></script>
  <script src="js/audio.js?v=6"></script>
  <script src="js/level.js?v=6"></script>
  <script src="js/game.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
</body>
</html>
